<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anaprilin reset</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f8fc;
        color: #1b2430;
      }

      main {
        width: min(92vw, 420px);
        padding: 24px;
        background: white;
        border: 1px solid #d4e0ee;
        border-radius: 8px;
      }

      button {
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        padding: 12px 14px;
        background: #0b6bcb;
        color: white;
        font: inherit;
        font-weight: 700;
      }

      p {
        color: #5d6b7a;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Сброс Safari</h1>
      <p id="status">Очищаю старый кэш приложения...</p>
      <button id="open" hidden>Открыть Anaprilin</button>
    </main>

    <script>
      async function reset() {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names.map((name) => caches.delete(name)));
          }

          localStorage.clear();
          sessionStorage.clear();

          document.getElementById("status").textContent = "Готово. Теперь открой приложение заново.";
          document.getElementById("open").hidden = false;
        } catch (error) {
          document.getElementById("status").textContent =
            "Сброс частично не прошел. Закрой Safari и попробуй открыть приложение снова.";
          document.getElementById("open").hidden = false;
        }
      }

      document.getElementById("open").addEventListener("click", () => {
        window.location.href = "/?after_reset=" + Date.now();
      });

      reset();
    </script>
  </body>
</html>
